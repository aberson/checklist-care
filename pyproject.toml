[project]
name = "checklist-care"
dynamic = ["version"]
description = "Turn life-advice sources into short, printable habit checklists for the rooms of a home."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
    "youtube-transcript-api>=1.2.5,<2",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
checklist-care = "checklist_care.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
# __version__ in the package is the single source of the version.
path = "src/checklist_care/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/checklist_care"]

[dependency-groups]
# Every QA tool lives here, so the declared bare `uv sync` installs it.
dev = [
    "httpx2>=2.5.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: needs the real network (YouTube, Wikipedia); excluded from the default gate and run in manual step M1",
]
